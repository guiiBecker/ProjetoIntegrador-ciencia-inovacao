version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=projetointegrador
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/mock_data.sql:/docker-entrypoint-initdb.d/02-mock_data.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d projetointegrador"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./projetointegrador-web
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    container_name: nest-backend
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=projetointegrador
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Reaplica sql/mock_data.sql a cada subida do backend (ambiente de testes)
      - SEED_ON_STARTUP=true
      - SEED_SQL_PATH=/app/sql/mock_data.sql
    volumes:
      - ./sql:/app/sql:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/auth/me", "||", "true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: ./projetointegrador-worker
      dockerfile: Dockerfile
    container_name: schedule-worker
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=projetointegrador
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Aponta explicitamente para o Python do venv com OR-Tools instalado,
      # evitando que resolvePythonBin() caia no python3 do sistema (sem ortools).
      - PYTHON_BIN=/opt/venv/bin/python3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./projetointegrador-html5
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: react-frontend
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
